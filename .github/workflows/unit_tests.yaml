---
on:
  pull_request:
    paths:
      - '**/*.go'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: unit tests
jobs:
  golang:
    timeout-minutes: 25
    strategy:
      matrix:
        go-version: ['1.27.x']
    runs-on: ubuntu-latest
    steps:
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Cache Go build and test cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # The suite drives the real, pinned sqlc; the tests that do not have it
      # skip. Installing it from the same file the Go code pins means the two
      # cannot drift, and UNISON_REQUIRE_SQLC turns those skips into failures
      # here — a CI run that quietly skipped them would have checked nothing.
      - name: Install the pinned sqlc
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < internal/sqlcdriver/sqlc-version)"

          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@${version}"
          sqlc version

      - name: run unit tests
        env:
          UNISON_REQUIRE_SQLC: "1"
        run: make test
