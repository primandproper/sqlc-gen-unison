---
on:
  pull_request:
    paths:
      - '**/*.go'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

name: formatting
jobs:
  golang:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26.x']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      # `gofmt -l` walks the filesystem rather than Go's package wildcard, so
      # unlike `go vet ./...` it has to be told which files are the module's own.
      # scripts/go_files.sh is the one place that answers, here and locally, by
      # asking the toolchain — which is what keeps vendor/ and testdata/ out.
      #
      # pipefail matters more than usual: without it, go_files.sh failing
      # mid-pipeline is masked by xargs exiting 0 on no input, and the step
      # passes having checked nothing at all.
      - name: check formatting
        run: |
          set -euo pipefail

          unformatted=$(scripts/go_files.sh . | xargs -0 gofmt -l)

          if [ -n "${unformatted}" ]; then
            echo "::error::gofmt reports these files as unformatted:"
            echo "${unformatted}"
            exit 1
          fi
